spring.application.name=restaurant-backend
server.port=${PORT:${SERVER_PORT:8080}}
server.address=0.0.0.0

# Database PostgreSQL.
# Local và production đều cấu hình bằng biến môi trường để không lưu mật khẩu trong Git.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Đăng nhập Google cho nhân viên.
# Dùng cùng OAuth 2.0 Web Client ID ở frontend và backend.
app.google.client-id=${GOOGLE_CLIENT_ID:}

# CORS cho frontend local và frontend production.
# Render ví dụ: https://lumora.food,https://www.lumora.food,https://lumora-frontend.onrender.com
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

# Upload ảnh món ăn
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.food-dir=${FOOD_UPLOAD_DIR:uploads/foods}
app.upload.avatar-dir=${AVATAR_UPLOAD_DIR:uploads/avatars}

# QR bàn ăn. Phải trùng địa chỉ frontend khách hàng.
# Ví dụ frontend chạy cổng 5174: APP_FRONTEND_BASE_URL=http://localhost:5174
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}
app.upload.qr-dir=${QR_UPLOAD_DIR:uploads/qrcodes}
app.qr.size=${QR_SIZE:300}

# VietQR thanh toán theo từng đơn hàng.
# Cấu hình bằng biến môi trường, không ghi thông tin tài khoản thật vào mã nguồn.
app.payment.vietqr.bank-id=${VIETQR_BANK_ID:}
app.payment.vietqr.bank-name=${VIETQR_BANK_NAME:}
app.payment.vietqr.account-no=${VIETQR_ACCOUNT_NO:}
app.payment.vietqr.account-name=${VIETQR_ACCOUNT_NAME:}
app.payment.vietqr.template=${VIETQR_TEMPLATE:compact2}
app.payment.vietqr.description-prefix=${VIETQR_DESCRIPTION_PREFIX:LUMORA}

# Quên mật khẩu bằng mã OTP gửi qua email.
# Local: để MAIL_ENABLED=false, mã OTP được ghi trong log backend để kiểm thử.
# Production: cấu hình SMTP bằng biến môi trường và đặt MAIL_ENABLED=true.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:5000}

# OTP có hiệu lực 10 phút; reset token sau khi xác minh OTP có hiệu lực 10 phút.
app.password-reset.otp-expiration-minutes=${PASSWORD_RESET_OTP_EXPIRATION_MINUTES:10}
app.password-reset.reset-token-expiration-minutes=${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:10}
app.password-reset.request-cooldown-seconds=${PASSWORD_RESET_REQUEST_COOLDOWN_SECONDS:60}
app.password-reset.max-verify-attempts=${PASSWORD_RESET_MAX_VERIFY_ATTEMPTS:5}

# Thông tin công khai dùng cho chatbot khách hàng.
# Nên cấu hình bằng biến môi trường khi triển khai để chatbot không tự suy đoán.
app.restaurant.name=${RESTAURANT_NAME:LUMORA}
app.restaurant.address=${RESTAURANT_ADDRESS:139 Nguy\u1EC5n Th\u1ECB Th\u1EADp, Thanh Kh\u00EA, \u0110\u00E0 N\u1EB5ng}
app.restaurant.phone=${RESTAURANT_PHONE:}
app.restaurant.email=${RESTAURANT_EMAIL:Ch\u01B0a c\u1EADp nh\u1EADt}
app.restaurant.opening-hours=${RESTAURANT_OPENING_HOURS:07:00 - 22:00}
app.restaurant.reservation-url=${RESTAURANT_RESERVATION_URL:/reservations}
app.restaurant.menu-url=${RESTAURANT_MENU_URL:/#menu}

# AI thật cho chatbot khách hàng (OpenAI Responses API).
# API key chỉ đặt ở backend qua biến môi trường, tuyệt đối không đưa vào frontend hoặc Git.
# Khi chưa có API key, bị timeout hoặc dịch vụ AI lỗi, chatbot tự dùng bộ nhận diện rule-based hiện có.
app.chatbot.ai.enabled=${CHATBOT_AI_ENABLED:false}
app.chatbot.ai.api-key=${OPENAI_API_KEY:}
app.chatbot.ai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
app.chatbot.ai.model=${OPENAI_MODEL:gpt-5-mini}
app.chatbot.ai.timeout-seconds=${CHATBOT_AI_TIMEOUT_SECONDS:20}
app.chatbot.ai.max-output-tokens=${CHATBOT_AI_MAX_OUTPUT_TOKENS:700}
app.chatbot.ai.max-history-messages=${CHATBOT_AI_MAX_HISTORY_MESSAGES:8}
app.chatbot.ai.minimum-confidence=${CHATBOT_AI_MIN_CONFIDENCE:0.45}

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Cloudinary lưu ảnh món ăn, ảnh đại diện và mã QR.
# Khóa thật chỉ cấu hình bằng Environment Variables trên Render.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Đặt món giao tận nơi.
app.delivery.inner-area-fee=${DELIVERY_INNER_AREA_FEE:15000}
app.delivery.nearby-area-fee=${DELIVERY_NEARBY_AREA_FEE:25000}
app.delivery.shipping-code-prefix=${DELIVERY_SHIPPING_CODE_PREFIX:LUM-VC}
app.delivery.max-units-per-item=${DELIVERY_MAX_UNITS_PER_ITEM:50}
app.delivery.max-units-per-order=${DELIVERY_MAX_UNITS_PER_ORDER:100}
